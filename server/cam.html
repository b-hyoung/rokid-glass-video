<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안경 카메라 시험</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1211; color: #dfe9e2; font: 15px/1.5 "Malgun Gothic", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid #22302a; background: #121715; }
  header .title { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; color: #3dff5a; }
  .sub { margin: 2px 0 0; color: #7f9a88; font-size: 12px; }
  #st { font-size: 12px; color: #cfe9d4; background: #1b2a22; border: 1px solid #2c4235; border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  section { background: #151b18; border: 1px solid #22302a; border-radius: 10px; padding: 14px 16px; }
  .controls { display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 0 0 10px; font-size: 19px; line-height: 1.3; color: #cfe9d4; }
  h2 small { font-size: 12px; color: #7f9a88; font-weight: 400; margin-left: 6px; }
  .row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; margin-top: 8px; }
  .row > span { font-size: 12px; color: #8fb39a; }
  .seg { display: flex; }
  .seg button { flex: 1; border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .fps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  .hint { margin: 8px 0 0; font-size: 12px; color: #8fb39a; }
  .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .actions button { padding: 12px 0; font-size: 19px; font-weight: 700; }
  button.start { background: #1f6f3a; border-color: #2c9a52; color: #fff; }
  button.halt { background: #5a2020; border-color: #8a3030; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  [hidden] { display: none !important; }
  button { background: #1b2a22; color: #dfe9e2; border: 1px solid #2c4235; border-radius: 6px; padding: 7px 8px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3dff5a; }
  button.stop { background: #5a2020; border-color: #8a3030; padding: 8px 16px; white-space: nowrap; }
  button[aria-pressed="true"] { background: #2c9a52; border-color: #3dff5a; color: #fff; position: relative; }
  .view { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #live { background: #000; border-radius: 10px; height: min(52vh, 480px); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #live canvas { flex: none; }
  .viewbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; color: #8fb39a; }
  .viewbar small { color: #6f8a78; }
  .viewbar .seg button { padding: 5px 10px; font-size: 12px; white-space: nowrap; }
  #live .empty { color: #556; }
  #now { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: #151b18; border: 1px solid #22302a; border-radius: 8px; padding: 8px 12px; }
  .stat b { display: block; font-size: 26px; line-height: 1.2; color: #3dff5a; font-weight: 700; }
  .stat small { color: #8fb39a; font-size: 12px; }
  .bottom { grid-column: 1 / -1; display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 6px; border-bottom: 1px solid #22302a; text-align: right; white-space: nowrap; }
  th { color: #8fb39a; font-weight: 600; }
  td:nth-child(2), th:nth-child(2) { text-align: left; }
  td.bad { color: #ff9b7a; }
  canvas { width: 100%; height: 180px; display: block; }
  footer { max-width: 1280px; margin: 0 auto; padding: 0 24px 20px; font-size: 12px; color: #6f8a78; word-break: break-all; }
  @media (max-width: 900px) { main, .bottom { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>안경 카메라 시험</h1>
    <p class="sub">이 페이지에서 버튼을 누르면 안경이 신호를 받아 그 속도로 찍어 보내고, 끝나면 결과가 표에 쌓입니다.</p>
  </div>
  <div id="st">-</div>
</header>
<main>
  <div class="controls">
    <section>
      <h2>① 방식</h2>
      <div class="seg" id="mode">
        <button data-mode="photo" aria-pressed="true">사진 한 장씩</button>
        <button data-mode="video" aria-pressed="false">동영상 스트림</button>
      </div>
      <p class="hint" id="mode-hint"></p>
    </section>
    <section>
      <h2>② 조건</h2>
      <div class="row"><span>시간</span><div class="seg" id="secs">
        <button data-sec="5" aria-pressed="true">5초</button>
        <button data-sec="60" aria-pressed="false">60초</button>
        <button data-sec="0" aria-pressed="false">끌 때까지</button>
      </div></div>
      <div data-for="photo">
        <div class="row"><span>범위</span><div class="seg" id="crop">
          <button data-crop="0.5" aria-pressed="true">가운데만</button>
          <button data-crop="1" aria-pressed="false">전체</button>
        </div></div>
        <div class="row"><span>화질</span><div class="seg" id="qual">
          <button data-q="80" aria-pressed="true">80</button>
          <button data-q="60" aria-pressed="false">60</button>
        </div></div>
      </div>
      <div data-for="video" hidden>
        <div class="row"><span>용량</span><div class="seg" id="rate">
          <button data-kbps="1000" aria-pressed="false">1Mbps</button>
          <button data-kbps="2000" aria-pressed="true">2Mbps</button>
          <button data-kbps="4000" aria-pressed="false">4Mbps</button>
        </div></div>
      </div>
    </section>
    <section>
      <h2>③ 초당 몇 장</h2>
      <div class="seg" id="fps"></div>
    </section>
    <section>
      <p class="hint" id="summary" style="margin:0 0 10px"></p>
      <div class="actions">
        <button class="start" id="start">시작</button>
        <button class="halt" id="off">중지</button>
      </div>
    </section>
  </div>
  <div class="view">
    <div class="viewbar"><span>화면 회전<small> · 안경 카메라가 옆으로 누워 있어 쓴 사람 기준으로 돌림</small></span>
      <div class="seg" id="rot">
        <button data-rot="0">0°</button><button data-rot="270">왼쪽 90°</button><button data-rot="180">180°</button><button data-rot="90">오른쪽 90°</button>
      </div></div>
    <div id="live"><canvas id="frame" hidden></canvas><span class="empty">아직 받은 사진 없음</span></div>
    <div id="now">
      <div class="stat"><small>받은 장 / 목표</small><b id="s-frames">-</b></div>
      <div class="stat"><small>실제 초당 / 설정</small><b id="s-real">-</b></div>
      <div class="stat"><small>배터리 · 온도</small><b id="s-bat">-</b></div>
      <div class="stat"><small>발열 단계</small><b id="s-th">-</b></div>
    </div>
  </div>
  <div class="bottom">
    <section>
      <h2>시험 결과</h2>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th>방식</th><th>설정</th><th>시간</th><th>받은 장</th><th>실제 초당</th><th>첫 장까지</th><th>장당 · 전송량</th><th>버림</th><th>배터리</th><th>온도</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
    <section>
      <h2>배터리 · 온도 변화<small>초록 배터리 · 주황 온도</small></h2>
      <canvas id="chart" width="460" height="180"></canvas>
    </section>
  </div>
</main>
<footer id="files"></footer>
<script>
  const q = location.search, $ = s => document.querySelector(s);
  const pick = (box, attr) => $(box + ' [aria-pressed="true"]').dataset[attr];
  const FPS = {photo: [1, 2, 5, 10, 15, 20, 30], video: [10, 15, 20, 30]};
  const HINT = {photo: '정한 속도로 사진(JPEG)을 한 장씩 보냅니다. 장당 용량이 커서 속도가 높으면 밀릴 수 있습니다.',
    video: '안경이 동영상(H.264)으로 압축해 한 줄로 흘려보냅니다. 용량이 작아 초당 30장에 유리합니다.'};
  const mode = () => pick('#mode', 'mode');
  function summary() { // 지금 고른 조건 요약(③을 누르면 이대로 시작)
    const m = mode(), sec = pick('#secs', 'sec');
    const parts = [m === 'video' ? '동영상' : '사진', '초당 ' + pick('#fps', 'fps') + '장', sec === '0' ? '끌 때까지' : sec + '초'];
    if (m === 'video') parts.push(pick('#rate', 'kbps') / 1000 + 'Mbps');
    else parts.push(pick('#crop', 'crop') === '1' ? '전체' : '가운데만', '화질 ' + pick('#qual', 'q'));
    $('#summary').textContent = '시작하면: ' + parts.join(' · ');
  }
  function showMode() {
    const m = mode();
    document.querySelectorAll('[data-for]').forEach(el => el.hidden = el.dataset.for !== m);
    $('#mode-hint').textContent = HINT[m];
    const keep = $('#fps [aria-pressed="true"]')?.dataset.fps;
    const def = FPS[m].includes(+keep) ? +keep : (m === 'video' ? 30 : 10);
    $('#fps').innerHTML = FPS[m].map(f => `<button data-fps="${f}" aria-pressed="${f === def}">${f}</button>`).join('');
  }
  for (const box of ['#mode', '#secs', '#crop', '#qual', '#rate', '#fps']) {
    $(box).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      $(box).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (box === '#mode') showMode();
      summary();
    });
  }
  const go = () => {
    const fps = pick('#fps', 'fps');
    const p = new URLSearchParams({mode: mode(), fps, sec: pick('#secs', 'sec'), crop: pick('#crop', 'crop'), q: pick('#qual', 'q'), kbps: pick('#rate', 'kbps')});
    fetch('cam/set?' + p + (q ? '&' + q.slice(1) : '')).then(r => r.json())
      .then(j => { $('#summary').textContent = `시험 #${j.test} 시작 · 초당 ${fps}장 신호 보냄`; setTimeout(summary, 3000); });
  };
  $('#start').onclick = go;
  showMode();
  summary();
  $('#off').onclick = () => fetch('cam/set?fps=0' + (q ? '&' + q.slice(1) : '')).then(() => { $('#summary').textContent = '중지함'; setTimeout(summary, 2000); });

  let shown = 0;
  // 화면 회전: 안경 카메라 센서가 옆으로 누워 있어 사진이 시계 방향 90°로 온다(11-04 실측) → 기본 왼쪽 90°
  let rot = +(localStorage.getItem('camRot') ?? 270);
  const img = new Image();
  function draw() {
    if (!img.naturalWidth) return;
    const c = $('#frame'), g = c.getContext('2d'), side = rot % 180 !== 0;
    c.width = side ? img.naturalHeight : img.naturalWidth;
    c.height = side ? img.naturalWidth : img.naturalHeight;
    g.save(); g.translate(c.width / 2, c.height / 2); g.rotate(rot * Math.PI / 180);
    g.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2); g.restore();
    c.hidden = false; $('#live .empty')?.remove();
    fit();
  }
  function fit() { // 비율을 지키며 칸 안에 맞춤
    const c = $('#frame'), box = $('#live');
    if (!c.width) return;
    const k = Math.min(box.clientWidth / c.width, box.clientHeight / c.height);
    c.style.width = Math.floor(c.width * k) + 'px';
    c.style.height = Math.floor(c.height * k) + 'px';
  }
  addEventListener('resize', fit);
  img.onload = draw;
  const markRot = () => $('#rot').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.rot === rot)));
  $('#rot').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    rot = +b.dataset.rot; localStorage.setItem('camRot', rot); markRot(); draw();
  });
  markRot();
  const T = t => t >= 0 ? (t / 10).toFixed(1) + '°' : '-';
  async function tick() {
    try {
      const s = await (await fetch('cam/stats')).json();
      const g = await (await fetch('status')).json();
      $('#st').textContent = '연결된 안경 ' + g.glasses + '대' + (s.test && !s.test.done ? ` · 시험 #${s.test.no} 진행 중 ${s.test.elapsed}초` : '');
      $('#files').textContent = '기록: ' + s.files.tests + ' · ' + s.files.tele;
      if (s.latest && s.latest.n !== shown) {
        shown = s.latest.n;
        img.src = 'cam/latest.jpg?n=' + shown; // 다 받으면 draw()가 돌려서 그린다
      }
      const t = s.test, busy = t && !t.done;
      $('#start').disabled = !!busy;
      $('#start').textContent = busy ? `진행 중 ${t.elapsed}초` : '시작';
      $('#s-frames').textContent = t ? `${t.frames} / ${t.sec ? t.fps * t.sec : '∞'}` : '-';
      $('#s-real').textContent = t ? `${t.real} / ${t.fps}` : '-';
      $('#s-bat').textContent = s.tele ? `${s.tele.bat}% · ${T(s.tele.temp)}` : '-';
      $('#s-th').textContent = s.tele ? (s.thermal[s.tele.th] ?? '-') : '-';
      $('#rows').innerHTML = s.results.map(r => {
        const want = r.sec ? r.fps * r.sec : null, low = want && r.frames < want * 0.9;
        return `<tr><td>${r.no}</td><td>${r.mode === 'video' ? '동영상' : '사진' + (r.crop < 1 ? ' 가운데' : ' 전체')}</td><td>${r.fps}장/초</td><td>${r.sec || '계속'}${r.sec ? '초' : ''}</td>`
          + `<td class="${low ? 'bad' : ''}">${r.frames}${want ? ' / ' + want : ''}</td><td class="${low ? 'bad' : ''}">${r.real}</td><td>${r.first ?? '-'}ms</td>`
          + `<td>${r.mode === 'video' ? r.rate + 'kbps' : r.kb + 'KB'}</td><td>${r.drop}</td><td>${r.bat0 ?? '-'}→${r.bat1 ?? '-'}%</td><td>${T(r.temp0)}→${T(r.temp1)}</td></tr>`;
      }).join('');
      chart(s.teleHist);
    } catch {}
  }
  function chart(h) {
    const c = $('#chart'), g = c.getContext('2d'), W = c.width, H = c.height;
    g.clearRect(0, 0, W, H);
    g.strokeStyle = '#22302a'; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, H * i / 4); g.lineTo(W, H * i / 4); g.stroke(); }
    if (h.length < 2) return;
    const t0 = h[0].at, t1 = h[h.length - 1].at, X = a => (a - t0) / Math.max(1, t1 - t0) * (W - 10) + 5;
    const line = (key, lo, hi, col) => {
      g.strokeStyle = col; g.lineWidth = 2; g.beginPath();
      h.forEach((p, i) => { const v = p[key]; if (v < 0) return; const y = H - 5 - (v - lo) / (hi - lo) * (H - 10); i ? g.lineTo(X(p.at), y) : g.moveTo(X(p.at), y); });
      g.stroke();
    };
    line('bat', 0, 100, '#3dff5a');
    line('temp', 250, 500, '#ffa45a'); // 25~50°C
    g.fillStyle = '#8fb39a'; g.font = '12px "Malgun Gothic"';
    g.fillText(`${Math.round((t1 - t0) / 60000)}분 · 배터리 0~100% · 온도 25~50°C`, 8, 14);
  }
  tick(); setInterval(tick, 400);
</script>
</body>
</html>
