<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안경 카메라 시험</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1211; color: #dfe9e2; font: 15px/1.5 "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
  h1 { margin: 0 0 2px; font-size: 26px; color: #3dff5a; }
  .sub { margin: 0 0 14px; color: #7f9a88; font-size: 12px; }
  section { background: #151b18; border: 1px solid #22302a; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  h2 { margin: 0 0 10px; font-size: 19px; color: #cfe9d4; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .row span { font-size: 12px; color: #8fb39a; min-width: 64px; }
  button { background: #1b2a22; color: #dfe9e2; border: 1px solid #2c4235; border-radius: 6px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3dff5a; }
  button.go { background: #1f6f3a; border-color: #2c9a52; color: #fff; min-width: 46px; }
  button.stop { background: #5a2020; border-color: #8a3030; }
  button[aria-pressed="true"] { background: #2c9a52; border-color: #3dff5a; color: #fff; }
  #st { font-size: 12px; color: #9aa3ad; }
  #live { position: relative; background: #000; border-radius: 10px; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #live img { max-width: 100%; max-height: 100%; }
  #live .empty { color: #556; }
  #now { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: #151b18; border: 1px solid #22302a; border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 26px; color: #3dff5a; font-weight: 700; }
  .stat small { color: #8fb39a; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 5px 6px; border-bottom: 1px solid #22302a; text-align: right; white-space: nowrap; }
  th { color: #8fb39a; font-weight: 600; }
  td:nth-child(2), th:nth-child(2) { text-align: left; }
  td.bad { color: #ff9b7a; }
  canvas { width: 100%; height: 160px; display: block; }
  .note { font-size: 12px; color: #7f9a88; }
</style>
</head>
<body>
<main>
  <div>
    <h1>안경 카메라 시험</h1>
    <p class="sub">버튼을 누르면 안경이 정한 속도로 카메라를 보내고, 끝나면 결과가 표에 쌓입니다.</p>
    <div id="st">-</div>
    <section>
      <h2>측정 시간</h2>
      <div class="row" id="secs">
        <button data-sec="5" aria-pressed="true">5초</button>
        <button data-sec="60" aria-pressed="false">60초</button>
        <button data-sec="0" aria-pressed="false">끌 때까지</button>
      </div>
    </section>
    <section>
      <h2>사진 방식 · 한 장씩 보내기</h2>
      <div class="row" id="photo"><span>초당</span></div>
      <div class="row" id="crop"><span>범위</span>
        <button data-crop="0.5" aria-pressed="true">가운데만</button>
        <button data-crop="1" aria-pressed="false">전체</button>
      </div>
      <div class="row" id="qual"><span>화질</span>
        <button data-q="80" aria-pressed="true">80</button>
        <button data-q="60" aria-pressed="false">60</button>
      </div>
    </section>
    <section>
      <h2>동영상 방식 · H.264 스트림</h2>
      <div class="row" id="video"><span>초당</span></div>
      <div class="row" id="rate"><span>용량</span>
        <button data-kbps="2000" aria-pressed="true">2Mbps</button>
        <button data-kbps="1000" aria-pressed="false">1Mbps</button>
        <button data-kbps="4000" aria-pressed="false">4Mbps</button>
      </div>
    </section>
    <button class="stop" id="off">카메라 끄기</button>
    <p class="note" id="files"></p>
  </div>
  <div>
    <div id="live"><span class="empty">아직 받은 사진 없음</span></div>
    <div id="now">
      <div class="stat"><small>받은 장</small><b id="s-frames">-</b></div>
      <div class="stat"><small>실제 초당</small><b id="s-real">-</b></div>
      <div class="stat"><small>배터리 · 온도</small><b id="s-bat">-</b></div>
      <div class="stat"><small>발열 단계</small><b id="s-th">-</b></div>
    </div>
    <section style="margin-top:14px">
      <h2>시험 결과</h2>
      <table>
        <thead><tr><th>#</th><th>방식</th><th>설정</th><th>시간</th><th>받은 장</th><th>실제 초당</th><th>첫 장까지</th><th>장당 · 전송량</th><th>버림</th><th>배터리</th><th>온도</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <section>
      <h2>배터리(초록) · 온도(주황) 변화</h2>
      <canvas id="chart" width="760" height="160"></canvas>
    </section>
  </div>
</main>
<script>
  const q = location.search, $ = s => document.querySelector(s);
  const pick = (box, attr) => $(box + ' [aria-pressed="true"]').dataset[attr];
  for (const box of ['#secs', '#crop', '#qual', '#rate']) {
    $(box).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      $(box).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    });
  }
  const go = (mode, fps) => {
    const p = new URLSearchParams({mode, fps, sec: pick('#secs', 'sec'), crop: pick('#crop', 'crop'), q: pick('#qual', 'q'), kbps: pick('#rate', 'kbps')});
    fetch('cam/set?' + p + (q ? '&' + q.slice(1) : ''));
  };
  for (const f of [1, 2, 5, 10, 15, 20, 30]) {
    const b = document.createElement('button'); b.className = 'go'; b.textContent = f; b.onclick = () => go('photo', f); $('#photo').append(b);
  }
  for (const f of [15, 30]) {
    const b = document.createElement('button'); b.className = 'go'; b.textContent = f; b.onclick = () => go('video', f); $('#video').append(b);
  }
  $('#off').onclick = () => fetch('cam/set?fps=0' + (q ? '&' + q.slice(1) : ''));

  let shown = 0;
  const T = t => t >= 0 ? (t / 10).toFixed(1) + '°' : '-';
  async function tick() {
    try {
      const s = await (await fetch('cam/stats')).json();
      const g = await (await fetch('status')).json();
      $('#st').textContent = '연결된 안경 ' + g.glasses + '대' + (s.test && !s.test.done ? ` · 시험 #${s.test.no} 진행 중 ${s.test.elapsed}초` : '');
      $('#files').textContent = '기록: ' + s.files.tests + ' · ' + s.files.tele;
      if (s.latest && s.latest.n !== shown) {
        shown = s.latest.n;
        const src = 'cam/latest.jpg?n=' + shown, img = $('#live img');
        if (img) img.src = src;
        else $('#live').innerHTML = `<img src="${src}" alt="안경 카메라 최신 사진">`;
      }
      const t = s.test;
      $('#s-frames').textContent = t ? `${t.frames} / ${t.sec ? t.fps * t.sec : '∞'}` : '-';
      $('#s-real').textContent = t ? `${t.real} / ${t.fps}` : '-';
      $('#s-bat').textContent = s.tele ? `${s.tele.bat}% · ${T(s.tele.temp)}` : '-';
      $('#s-th').textContent = s.tele ? (s.thermal[s.tele.th] ?? '-') : '-';
      $('#rows').innerHTML = s.results.map(r => {
        const want = r.sec ? r.fps * r.sec : null, low = want && r.frames < want * 0.9;
        return `<tr><td>${r.no}</td><td>${r.mode === 'video' ? '동영상' : '사진' + (r.crop < 1 ? ' 가운데' : ' 전체')}</td><td>${r.fps}장/초</td><td>${r.sec || '계속'}${r.sec ? '초' : ''}</td>`
          + `<td class="${low ? 'bad' : ''}">${r.frames}${want ? ' / ' + want : ''}</td><td class="${low ? 'bad' : ''}">${r.real}</td><td>${r.first ?? '-'}ms</td>`
          + `<td>${r.mode === 'video' ? r.rate + 'kbps' : r.kb + 'KB'}</td><td>${r.drop}</td><td>${r.bat0 ?? '-'}→${r.bat1 ?? '-'}%</td><td>${T(r.temp0)}→${T(r.temp1)}</td></tr>`;
      }).join('');
      chart(s.teleHist);
    } catch {}
  }
  function chart(h) {
    const c = $('#chart'), g = c.getContext('2d'), W = c.width, H = c.height;
    g.clearRect(0, 0, W, H);
    g.strokeStyle = '#22302a'; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, H * i / 4); g.lineTo(W, H * i / 4); g.stroke(); }
    if (h.length < 2) return;
    const t0 = h[0].at, t1 = h[h.length - 1].at, X = a => (a - t0) / Math.max(1, t1 - t0) * (W - 10) + 5;
    const line = (key, lo, hi, col) => {
      g.strokeStyle = col; g.lineWidth = 2; g.beginPath();
      h.forEach((p, i) => { const v = p[key]; if (v < 0) return; const y = H - 5 - (v - lo) / (hi - lo) * (H - 10); i ? g.lineTo(X(p.at), y) : g.moveTo(X(p.at), y); });
      g.stroke();
    };
    line('bat', 0, 100, '#3dff5a');
    line('temp', 250, 500, '#ffa45a'); // 25~50°C
    g.fillStyle = '#8fb39a'; g.font = '12px "Malgun Gothic"';
    g.fillText(`${Math.round((t1 - t0) / 60000)}분 · 배터리 0~100% · 온도 25~50°C`, 8, 14);
  }
  tick(); setInterval(tick, 400);
</script>
</body>
</html>
