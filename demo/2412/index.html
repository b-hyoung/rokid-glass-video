<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2412호 · 안경으로 보면 뜨는 영상</title>
<script type="importmap">{"imports":{"three":"../vendor/build/three.module.js","three/addons/":"../vendor/addons/"}}</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #dfe9e2; font: 14px/1.5 "Malgun Gothic", system-ui, sans-serif; }
  #view { position: fixed; inset: 0 340px 0 0; }
  #gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { cursor: grab; }
  #gl:active { cursor: grabbing; }
  #ov { pointer-events: none; }
  #glass { position: absolute; pointer-events: none; mix-blend-mode: screen; background: #000; }
  #glass[hidden], #dim[hidden] { display: none; }
  #dim { position: absolute; pointer-events: none; background: rgba(0,0,0,.72); border-radius: 10px;
         backdrop-filter: blur(3px); box-shadow: 0 0 0 1px rgba(61,255,90,.25); }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; background: #0d1210; border-left: 1px solid #1f2b24;
          display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  h1 { margin: 0; font-size: 21px; line-height: 1.3; color: #3dff5a; }
  .sub { margin: 0; color: #7f9a88; font-size: 12px; }
  .seg { display: flex; gap: 6px; }
  button { background: #16211b; color: #cfe9d4; border: 1px solid #2a3b31; border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3dff5a; }
  button[aria-pressed="true"] { background: #1f6f3a; border-color: #3dff5a; color: #fff; }
  button.rec[aria-pressed="true"] { background: #8a1c1c; border-color: #ff6060; }
  .seg button { flex: 1; }
  ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  ol li { padding: 6px 10px; border-radius: 6px; background: #121a16; color: #6f8a78; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  ol li.on { background: #173a22; color: #e6ffe9; }
  ol li b { font-weight: 600; }
  ol li span { color: #9fd8ab; text-align: right; }
  #bar { height: 4px; background: #1a241e; border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #3dff5a; }
  #log { flex: 1; overflow: auto; margin: 0; padding: 8px; background: #080b0a; border-radius: 6px; font: 12px/1.55 Consolas, "Malgun Gothic", monospace; color: #8fb39a; white-space: pre-wrap; word-break: keep-all; }
  #log div.api { color: #ffd76a; }
  #log div.warn { color: #ff9b7a; }
  label { font-size: 14px; color: #a9c2b0; display: flex; align-items: center; gap: 6px; }
  nav { position: fixed; left: 0; right: 340px; bottom: 0; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px;
        background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  nav button { background: rgba(14,20,17,.85); }
  #hint { position: fixed; left: 12px; top: 10px; color: #cfe; font-size: 12px; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; }
  #loading { position: fixed; left: 0; right: 340px; top: 45%; text-align: center; color: #8fb39a; }
</style>
</head>
<body>
<div id="view">
  <canvas id="gl"></canvas>
  <div id="dim" hidden></div>
  <video id="glass" playsinline crossorigin="anonymous" hidden></video>
  <canvas id="ov"></canvas>
</div>
<div id="hint">드래그로 고개 돌리기 · W A S D 걷기 · 스페이스 = 안경 탭(끄기)</div>
<div id="loading">2412호 불러오는 중…</div>
<nav id="views"></nav>
<aside>
  <div>
    <h1>2412호 · 안경으로 보면 뜨는 영상</h1>
    <p class="sub">카메라 인식 → 대상 하나 고르기 → 확정 → API(/play) → 안경 재생</p>
  </div>
  <div class="seg" role="group" aria-label="판단 방식">
    <button id="m-safe" aria-pressed="true">가운데 + 1초 확정</button>
    <button id="m-naive" aria-pressed="false">보이면 바로(나쁜 예)</button>
  </div>
  <ol id="steps">
    <li data-s="cam"><b>① 카메라 인식</b><span>-</span></li>
    <li data-s="pick"><b>② 조준점에 가까운 것</b><span>-</span></li>
    <li data-s="hold"><b>③ 잠깐 머무르기</b><span>-</span></li>
    <li data-s="api"><b>④ API 요청</b><span>-</span></li>
    <li data-s="play"><b>⑤ 안경 화면</b><span>-</span></li>
  </ol>
  <div id="bar"><i></i></div>
  <label><input type="checkbox" id="boxes" checked> 인식 상자 보기</label>
  <label><input type="checkbox" id="real"> 실제 안경에도 보내기(/play 호출)</label>
  <div class="seg">
    <button id="auto">자동 시연</button>
    <button id="rec" class="rec" aria-pressed="false">녹화</button>
    <button id="stop">끄기(탭)</button>
  </div>
  <pre id="log"></pre>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
